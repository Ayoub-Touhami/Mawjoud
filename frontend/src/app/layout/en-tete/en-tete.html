<header class="en-tete">
  <a class="accueil" routerLink="/" [attr.aria-label]="'app.accueilLien' | transloco">
    <app-logo />
  </a>

  <div class="outils">
    <app-selecteur-langue />
    <app-selecteur-theme />
    <button
      type="button"
      class="menu"
      [attr.aria-expanded]="ouvert()"
      aria-controls="navigation-principale"
      [attr.aria-label]="(ouvert() ? 'navigation.fermerMenu' : 'navigation.ouvrirMenu') | transloco"
      (click)="basculer()"
    >
      <app-icone [nom]="ouvert() ? 'fermer' : 'menu'" />
    </button>
  </div>

  <nav
    id="navigation-principale"
    [class.ouverte]="ouvert()"
    [attr.aria-label]="'navigation.principale' | transloco"
  >
    <a routerLink="/alertes" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">
      {{ 'navigation.mesAlertes' | transloco }}
    </a>
    <a routerLink="/pharmacien/inscription" routerLinkActive="actif">
      {{ 'navigation.jeSuisPharmacien' | transloco }}
    </a>
    <a class="connexion" appBouton variante="secondaire" routerLink="/compte/connexion">
      {{ 'navigation.seConnecter' | transloco }}
    </a>
  </nav>
</header>
