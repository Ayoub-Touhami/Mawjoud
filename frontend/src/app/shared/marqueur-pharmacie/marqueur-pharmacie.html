<svg
  viewBox="0 0 64 80"
  role="img"
  [attr.aria-label]="(inscrite() ? 'marqueur.inscrite' : 'marqueur.nonInscrite') | transloco"
>
  @if (inscrite()) {
    <path class="plein" [attr.d]="contour" />
    <path class="coche" [attr.d]="coche" />
  } @else {
    <path class="vide" [attr.d]="contour" />
    <path class="interrogation" [attr.d]="question" />
    <circle class="point" cx="32" cy="47" r="2.500" />
  }
</svg>
